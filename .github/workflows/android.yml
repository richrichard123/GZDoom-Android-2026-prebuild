name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease -Dorg.gradle.java.home=$JAVA_HOME_17_X64



    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Modernized UZDoom Mobile Port
        draft: false
        prerelease: false
        files: "**/build/o0utputs/apk/**/*.apk"



     
    - name: Find generated APK
      run: |
        find doom -type f -name "*.apk" -print

    - name: Save APK
      uses: actions/upload-artifact@v4
      with:
        name: Doom-Android-APK
        path: doom/build/outputs/apk/debug/*.apk
        if-no-files-found: error
          
