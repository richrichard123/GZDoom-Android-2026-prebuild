name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :doom:assembleDebug

      - name: Check APK output
        run: |
          find doom/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Doom-Android-APK
          path: doom/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Doom-Android-APK
          path: doom/build/outputs/apk/debug/*.apk
          
